pressure_gauge:
  description: "Demo rule for elastic-element pressure gauges. Not a real JJG clause."
  aliases:
    - 压力表
    - 一般压力表
    - 压力真空表
    - 真空表
  standard_instrument_types:
    - digital_pressure_gauge
    - pressure_calibrator
    - precision_pressure_gauge
  range:
    coverage_required: true
  accuracy:
    ratio: 4
    lower_is_better: true

digital_pressure_gauge:
  description: "Demo rule for digital pressure gauges."
  aliases:
    - 数字压力计
    - 数字压力表
  standard_instrument_types:
    - pressure_calibrator
    - precision_pressure_gauge
  range:
    coverage_required: true
  accuracy:
    ratio: 3
    lower_is_better: true

